# shellcheck shell=bash

LVM_NODE_COUNT=3
LVM_BASE_SSH_PORT=2201
LVM_RUNTIME_DIR=/tmp/libremesh-virtual-mesh
LVM_TMUX_SESSION=libremesh_mesh
LVM_TMUX_WINDOW=virtual-mesh
LVM_VM_MEMORY=512
LVM_VM_CPUS=2
LVM_QEMU_BIN=qemu-system-x86_64
LVM_QEMU_IMG_BIN=qemu-img
LVM_VWIFI_BIN=vwifi-server
LVM_VWIFI_ARGS="-u"
LVM_ATTACH_TMUX=1
LVM_MONITOR_HTTP_PORT=8004

# Optional overrides:
# LVM_OPENWRT_BUILD_DIR=/path/to/openwrt
# LVM_IMAGE_PATH=/path/to/openwrt/bin/targets/x86/64/openwrt-x86-64-generic-ext4-combined.img.gz
# LVM_MONITOR_SSH_PORT=2204
